databases:
  - name: sturtup-hub-db
    plan: free
    databaseName: sturtup_hub
    user: sturtup_hub_user

services:
  - type: web
    name: ai-community-club
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sturtup-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
